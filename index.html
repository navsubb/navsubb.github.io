<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pranav Subbarayan's CS 180 project portfolio"
    />
    <title>CS 180 — Pranav Subbarayan</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #1b1b1b;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      header,
      main {
        width: min(820px, calc(100% - 40px));
        margin: 0 auto;
      }

      header {
        padding: 24px 0;
        border-bottom: 1px solid #ddd;
        color: #555;
        font-size: 13px;
      }

      header a {
        color: #555;
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      main {
        padding: 100px 0 80px;
      }

      .label {
        margin: 0 0 16px;
        color: #666;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 8vw, 68px);
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .intro {
        max-width: 570px;
        margin: 24px 0 72px;
        color: #555;
        font-size: 18px;
      }

      .project {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 20px;
        align-items: start;
        padding: 28px 0;
        border-top: 1px solid #ddd;
        color: inherit;
        text-decoration: none;
      }

      .number,
      .description {
        color: #666;
        font-size: 13px;
      }

      .title {
        display: block;
        margin-bottom: 6px;
        font-size: 20px;
        font-weight: 600;
      }

      .project:hover .title {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      @media (max-width: 560px) {
        main {
          padding-top: 72px;
        }

        .project {
          grid-template-columns: 36px 1fr auto;
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span>Pranav Subbarayan</span>
      <span>CS 180 · Fall 2026</span>
    </header>

    <main>
      <p class="label">UC Berkeley · Fall 2026</p>
      <h1>CS 180</h1>
      <p class="intro">
        Intro to Computer Vision and Computational Photography. This portfolio
        contains my work from the course.
      </p>

      <nav aria-label="Course projects">
        <a class="project" href="./cs180/proj0/">
          <span class="number">00</span>
          <span>
            <span class="title">Becoming Friends with Your Camera</span>
            <span class="description">
              Perspective, focal length, and the dolly zoom
            </span>
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </nav>
    </main>
  </body>
</html>
