<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projects and coursework by Pranav Subbarayan"
    />
    <title>Pranav Subbarayan</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #1b1b1b;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(720px, calc(100% - 40px));
        margin: 0 auto;
        padding: 18vh 0 80px;
      }

      .name {
        margin: 0 0 56px;
        color: #666;
        font-size: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 64px);
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .intro {
        max-width: 500px;
        margin: 24px 0 72px;
        color: #555;
        font-size: 18px;
      }

      h2 {
        margin: 0;
        padding-bottom: 12px;
        border-bottom: 1px solid #ddd;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .project {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0;
        border-bottom: 1px solid #ddd;
        color: inherit;
        text-decoration: none;
      }

      .project:hover .project-title {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .project-title {
        display: block;
        font-size: 20px;
        font-weight: 600;
      }

      .project-detail {
        display: block;
        margin-top: 4px;
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="name">Pranav Subbarayan</p>
      <h1>Projects</h1>
      <p class="intro">
        A collection of coursework, experiments, and things I have built.
      </p>

      <section aria-labelledby="project-list">
        <h2 id="project-list">Selected work</h2>
        <a class="project" href="./cs180/">
          <span>
            <span class="project-title">CS 180</span>
            <span class="project-detail">
              Computer Vision and Computational Photography
            </span>
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </section>
    </main>
  </body>
</html>
