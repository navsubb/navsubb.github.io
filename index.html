<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pranav Subbarayan's CS 180 project portfolio"
    />
    <title>CS 180 — Pranav Subbarayan</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #111;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      main {
        width: min(640px, calc(100% - 40px));
        margin: 0 auto;
        padding: 14vh 0 80px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 32px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .course-name {
        margin: 6px 0 0;
        color: #666;
      }

      .meta {
        margin: 6px 0 0;
        color: #666;
        text-align: right;
        white-space: nowrap;
      }

      nav {
        margin-top: 120px;
        border-bottom: 1px solid #ddd;
      }

      a {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 20px;
        padding: 18px 0;
        border-top: 1px solid #ddd;
        color: inherit;
        text-decoration: none;
      }

      .project-number {
        color: #777;
      }

      a:hover .project-title {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @media (max-width: 480px) {
        main {
          padding-top: 64px;
        }

        header {
          display: block;
        }

        .meta {
          margin-top: 24px;
          text-align: left;
        }

        nav {
          margin-top: 80px;
        }

        a {
          grid-template-columns: 72px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CS 180</h1>
        </div>
        <p class="meta">Pranav Subbarayan<br />Fall 2026</p>
      </header>

      <nav aria-label="Course projects">
        <a href="./cs180/proj0/">
          <span class="project-number">Project 0</span>
          <span class="project-title">Becoming Friends with Your Camera</span>
        </a>
      </nav>
    </main>
  </body>
</html>
